# ==============================================================================
# Makima v2 — Dynamic System Configuration
# ==============================================================================

app:
  name: "Makima"
  version: "2.0.0"
  env: "development"
  data_dir: "~/.makima"
  log_level: "INFO"

# ------------------------------------------------------------------------------
# 1. Model Providers & Zero-Cost Pareto Routing
# ------------------------------------------------------------------------------
providers:
  default: "auto" # "auto" uses ParetoRouter to pick optimal active model
  circuit_breaker:
    max_failures: 3
    cooldown_seconds: 30
    jitter: true

  # Task Cascades: Prioritized free/active tiers
  cascades:
    fast_chat: ["gemini_3_8_live", "gemini", "gemini_live", "groq", "openrouter_free", "ollama"]
    code: ["gemini_3_8_live", "gemini", "gemini_live", "groq", "openrouter_free", "ollama"]
    deep_reasoning: ["gemini_3_8_live", "gemini", "gemini_live", "groq", "openrouter_free", "ollama"]
    vision: ["gemini_3_8_live", "gemini", "gemini_live"]
    voice: ["gemini_3_8_live", "gemini_live"]
    offline: ["ollama"]
    # OSWorld evaluates Makima end-to-end with Alibaba Cloud as its reasoning backend.
    osworld: [
      "alibaba_qwen_flash",
      "alibaba_qwen_omni_plus",
      "openrouter_free",
      "groq",
      "ollama",
    ]

  backends:
