name: Tool-selection regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tool-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Makima and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile touched Python packages
        run: python -m compileall -q makima tests/test_tool_selection.py
      - name: Run tool-selection regression tests
        run: python -m pytest -q tests/test_tool_selection.py
