[project]
name = "makima-v2"
version = "2.0.0"
description = "Autonomous Desktop & Swarm OS with Hermes Engine and Dynamic Pareto Routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "google-genai>=0.1.1",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
makima = "makima.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
