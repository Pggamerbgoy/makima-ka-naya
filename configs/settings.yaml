# ------------------------------------------------------------------------------
# 2. Multi-Platform Messaging Gateway Daemon
# ------------------------------------------------------------------------------
gateway:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  security:
    allow_all_users: false # When false, only allowlisted users can command agent
    allowlist_user_ids: []
    pairing_code_enabled: true

  platforms:
    telegram:
      enabled: false
      token_env: "TELEGRAM_BOT_TOKEN"
      require_mention_in_groups: true

    discord:
      enabled: false
      token_env: "DISCORD_BOT_TOKEN"
      voice_enabled: true

    whatsapp:
      enabled: false
      session_dir: "~/.makima/whatsapp_session"

# ------------------------------------------------------------------------------
# 3. Memory & Self-Improving Skills
# ------------------------------------------------------------------------------
memory:
  state_dir: "~/.makima/state"
  sqlite_path: "~/.makima/state/history.db"
  fts_enabled: true
  vector_search:
    enabled: true
    embedding_model: "BAAI/bge-small-en-v1.5"

skills:
  directory: "~/.makima/skills"
  auto_synthesize: true

# ------------------------------------------------------------------------------
# 4. OS & Tool Sandbox
# ------------------------------------------------------------------------------
tools:
  selection:
    enabled: true
    embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    minimum_similarity: 0.15
    minimum_candidates: 24
    # Expose all current tool schemas (68+) by default; narrow only once the
    # catalogue grows beyond this. Missing schemas cannot be selected by the LLM.
    max_candidates: 96

  sandbox:
    mode: "local_clamped" # "local_clamped" or "docker"
    workspace_dir: "~/.makima/workspace"
    command_timeout_seconds: 45
    block_dangerous_commands: true

  browser:
    headless: false # False allows visible browser window on user desktop
    stealth: true
    cdp_endpoint: "http://localhost:9222"

  concurrency:
    enabled: true
    max_concurrency: 8
    parallel_safe_tags:
      - "search"
      - "read"
      - "info"
      - "system_info"
      - "stats"
      - "telemetry"
      - "web"
      - "internet"
      - "research"
      - "query"
      - "memory"
      - "filesystem_read"
    mutating_tags:
      - "desktop"
      - "input"
      - "write"
      - "delete"
      - "control"
      - "exec"
      - "terminal"
      - "kill"
      - "window"
      - "mouse"
      - "keyboard"
      - "uia"
      - "mutating"

# ------------------------------------------------------------------------------
# 5. Multimodal Voice (Gemini 3.8 Live Bidirectional Audio — Zero TTS)
# ------------------------------------------------------------------------------
voice:
  engine: "gemini_live" # Native Gemini 3.8 Live bidirectional voice
  model: "gemini-3.8-live"
  voice_name: "Aoede" # Options: Aoede, Charon, Fenrir, Kore, Puck
  sounddevice:
    input_sample_rate: 16000 # 16kHz PCM input for Gemini Live
    output_sample_rate: 24000 # 24kHz PCM output from Gemini Live
    channels: 1
