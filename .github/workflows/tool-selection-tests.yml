name: Tool-selection regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tool-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Makima and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile touched Python packages
        run: python -m compileall -q makima tests/test_tool_selection.py tests/verify_engine.py tests/verify_tool_registry.py tests/verify_token_budget_history.py tests/verify_cronjob.py tests/test_cronjob_wiring.py
      - name: Run tool-selection regression tests
        run: python -m pytest -q tests/test_tool_selection.py
      - name: Run engine wiring verification
        run: python tests/verify_engine.py
      - name: Run tool registry verification
        run: python tests/verify_tool_registry.py
      - name: Run scheduled-job verification
        run: python tests/verify_cronjob.py
      - name: Run scheduler notification wiring regression tests
        run: python -m pytest -q tests/test_cronjob_wiring.py
      - name: Run token-budget history regression tests
        run: python tests/verify_token_budget_history.py
